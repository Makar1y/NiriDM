[workspace]
resolver = "2"
members = ["crates/NiriDM-core", "crates/NiriDM", "crates/NiriDM-daemon"]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Makar1y/NiriDM"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = "0.29"
libc = "0.2"